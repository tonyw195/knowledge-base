 to avoid site storage penalties.\n\n## Verbatim Intel Hash Excerpt\n> \"BCA Tiered Loyalty Volume Discount & Consolidated Multi-Vehicle Logistics: BCA operates a volume-tiered trade buyer scheme (Blue, Silver, Gold, Platinum) where active dealers purchasing 75+ to 1,000+ units annually unlock scaled reductions in buyer premium fees, discounted logistics, and extended site storage grace periods. In addition, MyBCA features multi-vehicle consolidated delivery booking for up to 10 vehicles across different branches, alongside the mandatory BCA Assured 40+ point inspection report.\"\n"

      "raw_body": "# Carwow Collects Transport Rate Reduction and Assured Scheme Protection\n\n## Summary\nCarwow has upgraded its transport logistics proposition, **Carwow Collects**, pairing discounted nationwide vehicle movements with built-in financial and mechanical loss indemnities under the **Assured Scheme**[^src-carwow-collects].\n\n## Logistics & Pricing Details\n- **Base Fee**: \u00a3115 for the first 50 miles[^src-carwow-collects].\n- **Incremental Rate**: \u00a31.25 per mile for every mile exceeding 50 miles[^src-carwow-collects].\n- **Cost Reduction**: Slashes transport fees by an average of \u00a320 for standard 140-mile transits[^src-motortradenews-collects].\n- **Included Logistics Overhead**: Absorbs seller-led cancellation charges, fuel/tolls, up to 1 hour driver wait time, and breakdown recovery[^src-carwow-collects].\n\n## Risk Mitigation & Assured Scheme Indemnity\n- **Mechanical & Electrical Cover**: Up to \u00a325,000 inc. VAT for significant undisclosed faults across engine, drivetrain, gearbox, cooling, and electrical components. Reporting window: within 13 days of collection[^src-carwow-collects].\n- **Financial Loss Indemnity**: Up to \u00a325,000 inc. VAT reimbursement if a vehicle is proven stolen, cloned, clocked, chipped, or an undocumented import. Reporting window: within 90 days of collection[^src-carwow-collects].\n- **Eligibility**: Vehicles under 10 years old, under 100,000 miles, and purchased for under \u00a3100,000 (standard non-prestige UK models)[^src-carwow-collects].\n\n[^src-carwow-collects]: [Carwow Collects vehicle transport service for car dealers](https://www.carwow.co.uk/partners/carwow-collects)\n[^src-motortradenews-collects]: [Carwow launches web portal for Carwow Collects, reduces transport costs](https://www.motortradenews.com/dealer-insights/carwow-launches-web-portal-for-carwow-collects-reduces-transport-costs/)\n"

      "raw_body": "# Carwow Remarketing Auctions: Zero Subscription & Embedded Settlement Model\n\n## Summary\nCarwow operates a direct-to-dealer remarketing auction model designed to compete with traditional physical and digital remarketers by eliminating subscription overheads and integrating real-time stocking finance[^src-carwow-auctions][^src-nextgear-carwow].\n\n## Commercial & Fee Terms\n- **Subscription Fee**: \u00a30/month. No recurring dealer subscription or platform access fees[^src-carwow-auctions].\n- **Buyer Fee Structure**: Starting from \u00a3199 (pegged to be on average 5% below leading competitor benchmarks)[^src-carwow-auctions].\n- **Payment Window**: Buyer fees invoiced upon successful vehicle purchase, payable within 7 days[^src-carwow-buyers-tc].\n\n## Auction Dynamics & FinTech Mechanics\n- **Extended Bidding Window**: Daily catalog releases open for bidding at 5:00 PM the evening prior, closing at 3:30 PM the following afternoon[^src-carwow-auctions].\n- **Bidding Engine**: Autobid increments set at \u00a31 above the next highest bid[^src-carwow-auctions].\n- **Carwow Wallet**: Airwallex-powered embedded payment gateway providing single-click split settlement to private sellers, finance houses, and Carwow fees[^src-nextgear-carwow].\n- **Integrated Floorplan Financing**: Native API integration with NextGear Capital and LE Capital stocking plans directly inside the platform checkout[^src-nextgear-carwow].\n\n[^src-carwow-auctions]: [Carwow Auctions For Dealers | Source Quality Used Stock](https://www.carwow.co.uk/partners/auctions)\n[^src-carwow-buyers-tc]: [Carwow Buyers Terms and Conditions](https://www.carwow.co.uk/partners/terms-and-conditions/buyers)\n[^src-nextgear-carwow]: [Carwow Dealer Financing Integration - NextGear Capital](https://nextgearcapital.co.uk/carwow/)\n"

      "raw_body": "# Carwow BuySafe Mechanical Protection, Reserve-Free Bidding & Retail Listings\n\nCarwow operates supplementary buyer risk mitigation under its **BuySafe** scheme alongside fundamental updates to daily auction mechanics and dealer onboarding incentives.[^carwow-buysafe-protection]\n\n## Core Offer & Risk Mitigation (BuySafe Scheme)\n* **Incentive Type:** Component Fault Warranty & Self-Collection Risk Mitigation\n* **Target Audience:** Independent dealers opting for self-collection or third-party vehicle transport rather than integrated *Carwow Collects* delivery.[^carwow-buysafe-protection]\n* **Cost & Tariff:** Flat fee of **\u00a359 + VAT** per vehicle.\n* **Coverage Scope:** Grants up to **\u00a37,500 protection per claim** covering approximately 3,000 components (engine, gearbox, electricals, and infotainment) for **5 days** following vehicle delivery or collection.[^carwow-buysafe-protection]\n* **Strategic Complement:** Provides a lower-cost protection alternative for buyers who do not need full *Carwow Collects* transport (\u00a325,000 Assured Scheme).\n\n## Auction Mechanics & B2B Commercial Incentives\n* **Reserve-Free Bidding Evolution:** Daily auctions transitioned away from traditional displayed seller reserve prices, embedding dynamic retail benchmark valuations (Auto Trader and Brego) directly on auction listings to accelerate bid volumes.[^cardealer-carwow-reserve-removal]\n* **Free Used Retail Listings:** Enrolled dealers earn complimentary used-car classified advertising listings on Carwow\u2019s consumer retail marketplace for every vehicle successfully acquired through daily auctions.[^cardealer-carwow-reserve-removal]\n* **IMDA Member Onboarding Advantage:** Members of the Independent Motor Dealers Association (IMDA) receive an exclusive **75% discount on their first auction purchase fee** upon joining the platform.[^carwow-imda-partnership]\n\n## Verbatim Intel Hash Excerpt\n> \"Carwow BuySafe Mechanical Fault Protection: \u0       "raw_body": "# Manheim Advantage Club Tiers, SureCheck 7-Day Guarantee & Fast Track Logistics\n\nManheim (the core remarketing division of Cox Automotive UK) operates a structured buyer incentive program based on purchase-volume account tiers, free pre-auction condition guarantees, and nationwide transport logistics.[^manheim-portal]\n\n## Core Buyer Incentives & Volume Tier Structure\n* **Incentive Type:** Tiered Volume Buyer Fee Discounts, Inspection Guarantee & Logistics Storage\n* **Tiered Account Loyalty Structure:**\n  * *Advantage Tier (1\u20133 vehicles/year):* Baseline registration tier for occasional traders.[^manheim-portal]\n  * *Club Tier (4\u201314 vehicles/year):* Unlocks reduced buyer premium tariffs across physical in-lane and digital sales.[^manheim-portal]\n  * *Club+ Tier (15+ vehicles/year):* Maximum reduction in per-vehicle buyer fees, dedicated Buyer Services account management, and discounted SureCheck rates.[^manheim-portal]\n* **Account Fee Waivers:** \u00a30 joining fee for new trade accounts and \u00a30 annual account maintenance fees.\n\n## Risk Mitigation & Condition Guarantee (SureCheck Scheme)\n* **SureCheck Inspection Scheme:** Pre-sale mechanical condition verification across multiple cover tiers: Bronze, Silver, Gold, LCV, and dedicated EV (covering high-voltage systems and drivetrains).[^cox-automotive-uk]\n* **Fault Rectification Promise:** If a vehicle is found to exhibit a mechanical or electrical defect contrary to the inspection report, Manheim covers the repair cost free of charge.[^manheim-portal]\n* **Industry-Leading SLA:** Offers an extended **7-day or 250-mile claims window** following purchase to report condition discrepancies.[^cox-automotive-uk]\n\n## Logistics, Delivery & Storage Concessions\n* **Fast Track Delivery:** Nationwide vehicle transport operated by Manheim Vehicle Services, moving single vehicles or full loads directly from any auction centre to mainland UK destinations.[^cox-automotive-uk]\n* **Complimentary Site Storage:** Trade buyers receive **3 working days of free vehicle storage** following sale date once payment has cleared before daily storage charges commence.[^manheim-portal]\n\n## Strategic Synergy Note\nManheim's SureCheck system also powers the condition guarantee engine for **Dealer Auction** (their joint venture with Auto Trader), creating a unified remarketing standard across both platforms.\n\n## Verbatim Intel Hash Excerpt\n> \"Manheim Advantage Club Tiers, SureCheck 7-Day Guarantee & Fast Track Logistics: Manheim (Cox Automotive UK) operates a volume-tiered trade buyer scheme (Advantage, Club, Club+) providing scaled reductions on buyer fees, zero joining fees, and dedicated account management. Backed by the SureCheck inspection scheme (Bronze, Silver, Gold, EV) offering free defect rectification with a 7-day or 250-mile claims window, alongside nationwide fast track vehicle delivery and 3 days of complimentary site storage.\"\n"

      "raw_body": "# Dealer Auction 30-Day Free Trial, \u00a3250 Buyer Fee Advantage & SureCheck Guarantee\n\nDealer Auction (a joint venture between Auto Trader and Cox Automotive) offers competitive incentives for independent motor traders, combining digital buyer fee savings against traditional auction houses with comprehensive condition guarantees.[^dealer-auction-platform]\n\n## Core Buyer Incentives & Fee Advantages\n* **Incentive Type:** Onboarding Free Trial, Buyer Fee Discount & Condition Guarantee\n* **Buyer Fee Cost Savings:** Highlights an average saving of **\u00a3250 per transaction** in buyer fees compared to physical auction halls.[^dealer-auction-platform]\n* **Onboarding Trial Incentive:** \n  * **30-Day Free Trial:** New independent motor dealers receive 30 days of full platform access with \u00a30 subscription fee (saving the standard \u00a399 + VAT/month fee) on a rolling no-contract agreement.[^dealer-auction-platform]\n* **Partner Subscription Waivers:**\n  * Dealers with an **Auto Trader advertising contract** or a **NextGear Capital stocking facility** receive platform access with **\u00a30 ongoing subscription fees**.[^dealer-auction-platform]\n* **Disposal / Seller Concession:** Enrolled independent dealers receive their **first vehicle sale free** each calendar month.\n\n## Risk Mitigation & Assurance (SureCheck)\n* **SureCheck Inspection Guarantee:** Operates in direct technical partnership with Manheim to provide structured condition guarantees (Bronze, Silver, Gold, and EV coverage).[^dealer-auction-surecheck]\n* **Discrepancy Rectification:** If a purchased vehicle exhibits an undisclosed mechanical or electrical condition fault, the issue is rectified free of charge.[^dealer-auction-surecheck]\n* **Dedicated Claims SLA:** Backed by an appraisal and claims app providing 24/7 digital claim lodgement with a mandatory 48-hour resolution SLA.[^dealer-auction-surecheck]\n\n## Operating Prerequisites & Market Integration\n* **Trader Verific       "raw_body": "# Aston Barclay Tiered Buyer Fees, Assured Inspection Guarantee & BCA Network Integration\n\nAston Barclay provides wholesale remarketing services across physical auction centres and digital channels, operating a volume-tiered fee schedule and structured condition guarantees, with physical and digital operations integrated under the Constellation Automotive Group (BCA) ecosystem.[^bca-constellation-network]\n\n## Core Buyer Incentives & Operational Structure\n* **Incentive Type:** Tiered Volume Buyer Fee Discounts, Inspection Guarantee & Digital Remarketing\n* **Tiered Buyer Fee Structure:**\n  * Volume-tiered buyer fee model spanning progressive purchase bands (from Standard to Elite), enabling high-turnover dealerships to unlock lower per-unit buyer premiums.[^aston-barclay-portal]\n  * Fees calculate against the gross hammer price, with rates aligned across unified Constellation/BCA network trading terms.\n* **Risk Mitigation & Condition Guarantee (Aston Barclay Assured):**\n  * **Standard Assured:** 31-point visual and mechanical condition assessment covering fluid levels, engine start, transmission, and braking performance via a 20-metre kinetic drive test.[^aston-barclay-portal]\n  * **EV & Hybrid Assured:** Expanded 35-point check including high-voltage charging cable checks and battery/drive indicators.\n  * **Fault Rectification:** Discrepancy claims submitted within 2 working days and under 250 miles of transport/collection cover agreed repair costs on undisclosed defects.[^aston-barclay-portal]\n  * **Assured Lite:** Lower-cost (\u00a310+VAT) informational check for vehicles over 12 years or 120,000 miles.\n\n## Auction Mechanics & 24/7 Digital Channels\n* **e-Xchange & Cascade System:** 24/7 digital wholesale exchange allowing trade buyers to purchase or bid on fresh inventory upstream before vehicles cascade into timed digital sales or physical lane auctions.[^aston-barclay-portal]\n* **Logistics & Delivery:** Nationwide vehicle transport ranging from single-vehicle plate delivery to multi-car transporter drops, supported by real-time telematics and digital condition verification at handover.[^aston-barclay-portal]\n\n## Strategic Market Note\nFollowing acquisition by Constellation Automotive Group, Aston Barclay physical auction locations and digital remarketing tools coordinate under the broader BCA operational and logistics umbrella, giving buyers access to unified inventory management and transport pipelines.[^bca-constellation-network]\n\n## Verbatim Intel Hash Excerpt\n> \"Aston Barclay Tiered Buyer Fees, Assured Inspection Guarantee & BCA Network Integration: Aston Barclay operates volume-tiered buyer fees (from Standard to Elite) and the Aston Barclay Assured 31-point vehicle inspection scheme (35-point for EV/hybrid with 20m kinetic drive test) covering repair costs on undisclosed discrepancies for stock under 12 years / 120k miles. Following acquisition by Constellation Automotive Group, physical centres and digital e-Xchange 24/7 sales are integrated into the unified BCA remarketing and logistics network.\"\n"

      let html = `
        <div class="node-header">
          <span class="node-type-pill ${typeClass}">${data.node_type.replace('_', ' ')}</span>
          <h2 class="node-title">${data.name || data.title || data.id}</h2>
        </div>
      `;

      html += `<table class="meta-table">`;
      html += `<tr><td>Node ID</td><td><code>${data.id}</code></td></tr>`;
      
      if (data.status) html += `<tr><td>Status</td><td><span class="badge" style="background:#065f46;color:#a7f3d0">${data.status}</span></td></tr>`;
      if (data.valid_until) html += `<tr><td>Valid Until</td><td>${data.valid_until}</td></tr>`;
      if (data.competitor) html += `<tr><td>Competitor</td><td><strong>${data.competitor.toUpperCase()}</strong></td></tr>`;
      if (data.category) html += `<tr><td>Category</td><td>${data.category}</td></tr>`;
      if (data.canonical_url) html += `<tr><td>Canonical URL</td><td><a href="${data.canonical_url}" target="_blank">Open Link &nearr;</a></td></tr>`;
      if (data.filepath) html += `<tr><td>Source File</td><td><code>${data.filepath}</code></td></tr>`;
      html += `</table>`;

      // Render Markdown if available
      if (data.raw_body) {
        const rendered = marked.parse(data.raw_body);
        html += `<div class="markdown-body">${rendered}</div>`;
      } else if (data.description) {
        html += `<div class="markdown-body"><p>${data.description}</p></div>`;
      }

      // Connections List
      const neighbors = node.neighborhood().nodes();
      if (neighbors.length > 0) {
        html += `<div class="connections-section"><h4>Connected Concepts (${neighbors.length})</h4>`;
        neighbors.forEach(n => {
          const nd = n.data();
          const lbl = nd.name || nd.title || nd.id;
          html += `<span class="conn-pill" onclick="window.focusNodeById('${nd.id}')">${lbl}</span>`;
        });
        html += `</div>`;
      }

      sidebarContent.innerHTML = html;
    }

    window.focusNodeById = function(nodeId) {
      const n = cy.getElementById(nodeId);
      if (n && n.length > 0) {
        cy.animate({
          center: { eles: n },
          zoom: 1.4,
          duration: 400
        });
        selectNode(n);
      }
    };

    cy.on('tap', 'node', function(evt) {
      selectNode(evt.target);
    });

    cy.on('tap', function(evt) {
      if (evt.target === cy) {
        cy.elements().removeClass('highlighted dimmed');
        sidebar.style.display = 'none';
      }
    });

    document.getElementById('btn-close').addEventListener('click', () => {
      cy.elements().removeClass('highlighted dimmed');
      sidebar.style.display = 'none';
    });

    // Search Filtering
    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', function() {
      const q = this.value.trim().toLowerCase();
      if (!q) {
        cy.elements().removeClass('highlighted dimmed');
        return;
      }
      cy.elements().addClass('dimmed').removeClass('highlighted');
      const matches = cy.nodes().filter(n => {
        const d = n.data();
        const str = ((d.label || '') + ' ' + (d.title || '') + ' ' + (d.name || '') + ' ' + (d.summary || '')).toLowerCase();
        return str.includes(q);
      });
      matches.removeClass('dimmed').addClass('highlighted');
    });

    // Layout Selector
    document.getElementById('layout-select').addEventListener('change', function() {
      const l = cy.layout({ name: this.value, animate: true, animationDuration: 600 });
      l.run();
    });

    document.getElementById('btn-fit').addEventListener('click', () => cy.fit(null, 40));
    document.getElementById('btn-reset').addEventListener('click', () => {
      searchInput.value = '';
      cy.elements().removeClass('highlighted dimmed');
      sidebar.style.display = 'none';
      cy.fit(null, 40);
    });
  </script>
</body>
</html>
